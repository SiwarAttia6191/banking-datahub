name: ci

# compile, run the unit tests and package the assembly jars on every push and
# pull request - the same sbt pipeline the gitlab ci and the jenkinsfile run,
# now proven on the platform this repository lives on (issue #39).
# the committed .jvmopts carries the java-17 add-opens the spark tests need.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: install sbt
        uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: compile, test, package
        run: sbt compile test assembly

      - name: jars built
        run: ls -lh modules/*/target/scala-2.12/*assembly*.jar
