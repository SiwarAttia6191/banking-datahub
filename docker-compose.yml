name: banking-datahub

services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -ip=s3
    ports:
      - "8333:8333"   # s3 api
      - "9333:9333"   # master ui
    volumes:
      - weed-data:/data

  postgres:
    image: postgres:16
    ports:
      # host 5436: 5432 = windows postgres service, 5433 = rag-advisor stack,
      # 5434 = smart-delivery-ops, 5435 = madrid-demo - one distinct port per project
      - "5436:5432"
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub
      POSTGRES_DB: datahub
    volumes:
      - pg-data:/var/lib/postgresql/data

  dremio:
    image: dremio/dremio-oss:latest
    container_name: banking-datahub-dremio
    ports:
      - "9047:9047"   # dremio ui
      - "2181:2181"   # zookeeper (dremio coordinator)
    volumes:
      - dremio-data:/opt/dremio/data

volumes:
  weed-data:
  pg-data:
  dremio-data:
