name: banking-datahub

services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -ip=s3
    ports:
      - "8333:8333"   # s3 api
      - "9333:9333"   # master ui
    volumes:
      - weed-data:/data

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub
      POSTGRES_DB: datahub
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  weed-data:
  pg-data:
