datahub {
  environment = "local"

  spark {
    # overridable per environment (SPARK_MASTER env var) or per submit (--master)
    master = "local[*]"
    master = ${?SPARK_MASTER}
  }

  rules {
    # RULE_VOLUME_SPIKE fires when the account-day sum exceeds this z-score (or is a
    # boxplot outlier); the alert score grows with the z-score up to 2x the base weight
    volume-zscore-threshold = 3.0

    # share of rejects the curated layer may produce before the dq report fails
    max-reject-rate = 0.05

    # statistical methodology - mirrors the production AML detection approach, where
    # every geography tuned its own rule book: the knobs are configuration, not code
    baseline-window-days = 31   # rolling baseline window
    baseline-offset-days = 7    # the evaluated day + the week before never enter their own baseline
    min-vector-length    = 15   # no statistical test below this history: no false positives
  }

  s3 {
    # any S3-compatible endpoint works; SeaweedFS is the local stand-in.
    # ${?VAR} = take the env var when set, otherwise keep the default above.
    # inside the docker-compose network the endpoint is http://s3:8333
    endpoint          = "http://localhost:8333"
    endpoint          = ${?S3A_ENDPOINT}
    access-key        = "dev-access-key"
    access-key        = ${?S3A_ACCESS_KEY}
    secret-key        = "dev-secret-key"
    secret-key        = ${?S3A_SECRET_KEY}
    raw-bucket        = "lake-raw"
    raw-bucket        = ${?S3A_RAW_BUCKET}
    curated-bucket    = "lake-curated"
    curated-bucket    = ${?S3A_CURATED_BUCKET}
    # legacy-style output of the baseline job (the hive script port) - the
    # reconciliation job compares it against the curated layer
    legacy-bucket     = "lake-legacy"
    legacy-bucket     = ${?S3A_LEGACY_BUCKET}
    # path-style access: required by the local s3 store, harmless against cloud providers
    path-style-access = true
  }

  serving {
    # the serving layer: curated aggregates + alerts published for the business
    url      = "jdbc:postgresql://postgres:5432/datahub"
    url      = ${?SERVING_JDBC_URL}
    user     = "datahub"
    user     = ${?SERVING_USER}
    password = "datahub"
    password = ${?SERVING_PASSWORD}
  }
}
